name: Auto Edit Munnar Vlog
on: [workflow_dispatch]

jobs:
  edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q gdown

      - name: Download & Edit Vlog
        run: |
          cat << 'EOF' > edit.py
          import os, glob, subprocess, shutil
          DRIVE_LINK = "https://drive.google.com/drive/folders/1tUd2HNXpDTPRekMlnOiYqDbcpi6Th-fx"
          os.makedirs("raw", exist_ok=True)
          os.makedirs("work", exist_ok=True)
          os.system(f'gdown --folder "{DRIVE_LINK}" -O raw --continue')
          clips = sorted([c for c in glob.glob("raw/**/*.*", recursive=True) if c.lower().endswith(('.mp4', '.mov', '.mkv')) and "Final_" not in c])
          bgm = glob.glob("raw/**/bgm.mp3", recursive=True)
          if not clips:
              raise FileNotFoundError("No videos downloaded! Check Drive folder link and permissions.")
          def get_info(p):
              out = subprocess.check_output(['ffprobe', '-v', 'error', '-select_streams', 'v:0', '-show_entries', 'stream=width,height:format=duration', '-of', 'default=noprint_wrappers=1:nokey=1', p]).decode().strip().splitlines()
              return int(out[0]), int(out[1]), float(out[2])
          infos = [get_info(c) for c in clips]
          durs = [x[2] for x in infos]
          total = sum(durs)
          W, H = (1080, 1920) if infos[0][1] > infos[0][0] else (1920, 1080)
          parts, idx_p = [], 0
          SEG_LEN = 2.2
          for i, (c, d) in enumerate(zip(clips, durs)):
              alloc = max(2.5, (d / total) * 315) if total > 315 else d
              if d <= alloc or d <= 3.0:
                  segs = [(0.0, d)]
              else:
                  n_seg = max(1, int(alloc // SEG_LEN))
                  step = (d - SEG_LEN) / max(1, n_seg)
                  segs = [(k * step, SEG_LEN) for k in range(n_seg)]
              for st, cd in segs:
                  trf, out = f"work/t_{idx_p}.trf", f"work/p_{idx_p:04d}.mp4"
                  sp = f"scale={W}:{H}:force_original_aspect_ratio=decrease,pad={W}:{H}:(ow-iw)/2:(oh-ih)/2"
                  subprocess.run(['ffmpeg', '-y', '-ss', str(st), '-t', str(cd), '-i', c, '-vf', f'{sp},vidstabdetect=shakiness=5:accuracy=8:result={trf}', '-f', 'null', '-'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  subprocess.run(['ffmpeg', '-y', '-ss', str(st), '-t', str(cd), '-i', c, '-vf', f"{sp},vidstabtransform=input={trf}:smoothing=14:zoom=4,eq=contrast=1.07:saturation=1.16:brightness=0.01", '-af', 'volume=0.55', '-r', '30', '-c:v', 'libx264', '-preset', 'fast', '-crf', '26', '-c:a', 'aac', '-ar', '44100', '-ac', '2', '-b:a', '96k', '-shortest', out], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if os.path.exists(out): parts.append(out); idx_p += 1
          with open("work/list.txt", "w") as f:
              for p in parts: f.write(f"file '{os.path.abspath(p)}'\n")
          subprocess.run(['ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', 'work/list.txt', '-c', 'copy', 'work/merged.mp4'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          if bgm:
              subprocess.run(['ffmpeg', '-y', '-i', 'work/merged.mp4', '-stream_loop', '-1', '-i', bgm[0], '-filter_complex', '[0:a]volume=1.0[orig];[1:a]volume=0.15[b];[orig][b]amix=inputs=2:duration=first:dropout_transition=2[aout]', '-map', '0:v', '-map', '[aout]', '-c:v', 'copy', '-c:a', 'aac', '-b:a', '128k', '-shortest', 'Final_Munnar_Vlog_5Min.mp4'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          else:
              shutil.move('work/merged.mp4', 'Final_Munnar_Vlog_5Min.mp4')
          EOF
          python edit.py

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Munnar-Vlog-5Min
          path: Final_Munnar_Vlog_5Min.mp4
