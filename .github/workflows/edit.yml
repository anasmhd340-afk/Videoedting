name: Pro Cloud Video Editor

on:
  workflow_dispatch:
    inputs:
      drive_link:
        description: 'Google Drive Folder Link'
        required: true
        type: string
      video_title:
        description: 'Output Video Name (Example: Munnar_Trip)'
        required: true
        default: 'Edited_Vlog'
        type: string
      target_seconds:
        description: 'Target Duration in Seconds (0 = Keep all clips full)'
        required: true
        default: '180'
        type: string
      trim_silence:
        description: 'Dead-Air / Silence Trimmer (Auto Jump-Cut on Talking Clips)'
        required: true
        default: 'on'
        type: choice
        options:
          - 'on'
          - 'off'
      color_grade:
        description: 'Color Style (Auto-uses .cube LUT if present in folder)'
        required: true
        default: 'cinematic'
        type: choice
        options:
          - cinematic
          - natural
          - vibrant
          - none

jobs:
  edit-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q gdown requests opencv-contrib-python-headless

      - name: Run Pro Cloud Video Editor
        env:
          DRIVE_LINK: ${{ github.event.inputs.drive_link }}
          VIDEO_TITLE: ${{ github.event.inputs.video_title }}
          TARGET_SECONDS: ${{ github.event.inputs.target_seconds }}
          TRIM_SILENCE: ${{ github.event.inputs.trim_silence }}
          COLOR_GRADE: ${{ github.event.inputs.color_grade }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          cat << 'EOF' > edit.py
          import os, re, glob, json, subprocess, shutil, requests
          from datetime import datetime, timezone, timedelta

          try:
              import cv2
          except Exception:
              cv2 = None

          DRIVE_LINK = os.environ.get("DRIVE_LINK", "").strip()
          RAW_TITLE = os.environ.get("VIDEO_TITLE", "Edited_Vlog").strip()
          SAFE_TITLE = re.sub(r'[^a-zA-Z0-9_-]', '_', RAW_TITLE) or "Edited_Vlog"
          TARGET_SECONDS = int(os.environ.get("TARGET_SECONDS", "180") or "180")
          TRIM_SILENCE = os.environ.get("TRIM_SILENCE", "on").strip()
          COLOR_GRADE = os.environ.get("COLOR_GRADE", "cinematic").strip()

          ist = timezone(timedelta(hours=5, minutes=30))
          timestamp = datetime.now(ist).strftime("%Y%m%d_%H%M")
          FINAL_FILE = f"{SAFE_TITLE}_{timestamp}.mp4"

          os.makedirs("raw", exist_ok=True)
          os.makedirs("work", exist_ok=True)

          print(f"📥 Google Drive-ൽ നിന്ന് ഫയലുകൾ ഡൗൺലോഡ് ചെയ്യുന്നു ({SAFE_TITLE})...")
          os.system(f'gdown --folder "{DRIVE_LINK}" -O raw --continue')

          clips = sorted([
              c for c in glob.glob("raw/**/*.*", recursive=True)
              if c.lower().endswith(('.mp4', '.mov', '.mkv')) and not os.path.basename(c).startswith(SAFE_TITLE)
          ])
          bgm_files = sorted([
              a for a in glob.glob("raw/**/*.*", recursive=True)
              if a.lower().endswith(('.mp3', '.m4a', '.wav', '.aac', '.ogg'))
          ])
          lut_files = sorted(glob.glob("raw/**/*.cube", recursive=True))

          if not clips:
              raise FileNotFoundError("No videos downloaded! Check Drive folder link and 'Anyone with the link' permission.")

          def get_info(p):
              out = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-select_streams', 'v:0',
                  '-show_entries', 'stream=width,height:format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', p
              ]).decode().strip().splitlines()
              aud = subprocess.check_output([
                  'ffprobe', '-v', 'error', '-select_streams', 'a:0',
                  '-show_entries', 'stream=codec_type',
                  '-of', 'default=noprint_wrappers=1:nokey=1', p
              ]).decode().strip()
              return int(out[0]), int(out[1]), float(out[2]), bool(aud)

          # 1. Safe Face-Aware Detection (OpenCV)
          face_cascade = None
          if cv2 is not None:
              try:
                  xml_path = os.path.join(cv2.data.haarcascades, 'haarcascade_frontalface_default.xml')
                  if hasattr(cv2, 'CascadeClassifier') and os.path.exists(xml_path):
                      face_cascade = cv2.CascadeClassifier(xml_path)
                  elif hasattr(cv2, 'objdetect') and hasattr(cv2.objdetect, 'CascadeClassifier') and os.path.exists(xml_path):
                      face_cascade = cv2.objdetect.CascadeClassifier(xml_path)
              except Exception:
                  pass

          def get_face_intervals(video_path, duration):
              if face_cascade is None or cv2 is None:
                  return []
              try:
                  cap = cv2.VideoCapture(video_path)
                  fps = cap.get(cv2.CAP_PROP_FPS) or 30.0
                  step_frames = max(1, int(fps * 0.5))
                  face_times = []
                  frame_idx = 0

                  while True:
                      ret, frame = cap.read()
                      if not ret:
                          break
                      if frame_idx % step_frames == 0:
                          small = cv2.resize(frame, (320, 180))
                          gray = cv2.cvtColor(small, cv2.COLOR_BGR2GRAY)
                          faces = face_cascade.detectMultiScale(gray, scaleFactor=1.15, minNeighbors=4, minSize=(20, 20))
                          if len(faces) > 0:
                              face_times.append(frame_idx / fps)
                      frame_idx += 1
                  cap.release()

                  if not face_times:
                      return []

                  intervals = []
                  start_t = max(0.0, face_times[0] - 0.5)
                  prev_t = face_times[0]
                  for t in face_times[1:]:
                      if t - prev_t <= 1.5:
                          prev_t = t
                      else:
                          intervals.append((start_t, min(duration, prev_t + 0.6)))
                          start_t = max(0.0, t - 0.5)
                          prev_t = t
                  intervals.append((start_t, min(duration, prev_t + 0.6)))
                  return [(s, e) for s, e in intervals if (e - s) >= 1.2]
              except Exception:
                  return []

          # 2. Voice-Aware Detection
          def get_speech_intervals(video_path, duration):
              res = subprocess.run([
                  'ffmpeg', '-i', video_path, '-af', 'highpass=f=180,silencedetect=noise=-28dB:d=0.6',
                  '-f', 'null', '-'
              ], capture_output=True, text=True)
              silences = []
              cur_start = None
              for line in res.stderr.splitlines():
                  if 'silence_start:' in line:
                      m = re.search(r'silence_start:\s*([0-9.]+)', line)
                      if m:
                          cur_start = float(m.group(1))
                  elif 'silence_end:' in line and cur_start is not None:
                      m = re.search(r'silence_end:\s*([0-9.]+)', line)
                      if m:
                          silences.append((cur_start, float(m.group(1))))
                          cur_start = None
              if cur_start is not None:
                  silences.append((cur_start, duration))

              speech = []
              cur = 0.0
              for sil_s, sil_e in silences:
                  if sil_s - cur >= 0.9:
                      speech.append((max(0.0, cur - 0.25), min(duration, sil_s + 0.25)))
                  cur = sil_e
              if duration - cur >= 0.9:
                  speech.append((max(0.0, cur - 0.25), duration))
              return speech

          # 3. Dead-Air / Silence Trimmer
          def remove_dead_air(video_path, base_intervals):
              res = subprocess.run([
                  'ffmpeg', '-i', video_path, '-af', 'silencedetect=noise=-32dB:d=0.8',
                  '-f', 'null', '-'
              ], capture_output=True, text=True)
              silences = []
              cur_start = None
              for line in res.stderr.splitlines():
                  if 'silence_start:' in line:
                      m = re.search(r'silence_start:\s*([0-9.]+)', line)
                      if m:
                          cur_start = float(m.group(1))
                  elif 'silence_end:' in line and cur_start is not None:
                      m = re.search(r'silence_end:\s*([0-9.]+)', line)
                      if m:
                          silences.append((cur_start, float(m.group(1))))
                          cur_start = None
              if cur_start is not None:
                  silences.append((cur_start, 99999.0))

              if not silences:
                  return base_intervals

              refined = []
              pad = 0.22
              for s, e in base_intervals:
                  cur = s
                  for sil_s, sil_e in silences:
                      if sil_e <= cur or sil_s >= e:
                          continue
                      cut_end = min(e, sil_s + pad)
                      if cut_end - cur >= 0.8:
                          refined.append((cur, cut_end))
                      cur = max(cur, sil_e - pad)
                  if e - cur >= 0.8:
                      refined.append((cur, e))
              return refined if refined else base_intervals

          infos = [get_info(c) for c in clips]
          W, H = (1080, 1920) if infos[0][1] > infos[0][0] else (1920, 1080)
          parts, idx_p = [], 0

          # 4. Pre-scan clips to calculate Protected Duration vs B-Roll Budget
          clip_plans = []
          protected_dur = 0.0
          broll_total_dur = 0.0

          for c, info in zip(clips, infos):
              _, _, d, has_audio = info

              if d <= 7.0 or TARGET_SECONDS == 0:
                  segs = [(0.0, d)]
                  protected_dur += d
                  clip_plans.append((c, info, "full", segs))
              else:
                  face_segs = get_face_intervals(c, d)
                  speech_segs = get_speech_intervals(c, d) if (not face_segs and has_audio) else []

                  if face_segs:
                      if TRIM_SILENCE == "on" and has_audio:
                          face_segs = remove_dead_air(c, face_segs)
                      segs = [(s, e - s) for s, e in face_segs if (e - s) >= 0.8]
                      protected_dur += sum(cd for _, cd in segs)
                      clip_plans.append((c, info, "face", segs))
                  elif speech_segs:
                      if TRIM_SILENCE == "off":
                          speech_segs = [(0.0, d)]
                      segs = [(s, e - s) for s, e in speech_segs if (e - s) >= 0.8]
                      protected_dur += sum(cd for _, cd in segs)
                      clip_plans.append((c, info, "speech", segs))
                  else:
                      broll_total_dur += d
                      clip_plans.append((c, info, "broll", []))

          # 2.5s Alternating Cut Ratio based on Target Duration
          SEG_LEN = 2.5
          if broll_total_dur > 0:
              remaining_budget = max(0.0, TARGET_SECONDS - protected_dur)
              broll_ratio = min(1.0, max(0.10, remaining_budget / broll_total_dur))
              step_interval = SEG_LEN / broll_ratio
              print(f"⏱️ Target: {TARGET_SECONDS}s | Protected: {protected_dur:.1f}s | B-Roll Ratio: {broll_ratio*100:.0f}% (Every {step_interval:.1f}s -> 2.5s cut)")

          # 5. Auto-Exposure & White Balance + Color Grade
          auto_wb_exp = "normalize=independence=0:strength=0.30:smoothing=15"
          presets = {
              "cinematic": f"{auto_wb_exp},colorbalance=rs=-0.03:gs=0.02:bs=0.04:rh=0.04:gh=0.02:bh=-0.03,eq=contrast=1.07:saturation=1.15",
              "natural": f"{auto_wb_exp},eq=contrast=1.03:saturation=1.05",
              "vibrant": f"{auto_wb_exp},eq=contrast=1.09:saturation=1.26",
              "none": auto_wb_exp
          }
          default_color = presets.get(COLOR_GRADE, presets["cinematic"])

          if lut_files:
              print(f"🎨 Auto-Exposure + Custom LUT: {os.path.basename(lut_files[0])}")
              color_filter = f"{auto_wb_exp},lut3d=file='{lut_files[0]}':interp=trilinear,eq=contrast=1.04:saturation=1.08"
          else:
              print(f"🎨 Auto-Exposure & White Balance + Preset: {COLOR_GRADE}")
              color_filter = default_color

          # 6. Audio Engine: 100% Normal Voice + 35% Ambient Sound
          def run_encode(c, st, cd, vf_str, has_audio, smart_audio, out_path):
              if os.path.exists(out_path):
                  os.remove(out_path)
              if has_audio:
                  if smart_audio:
                      af_str = "highpass=f=160,compand=attacks=0.05:decays=0.35:points=-70/-79|-35/-44|-24/-24|0/-1:soft-knee=6,loudnorm=I=-16:TP=-1.5:LRA=11"
                  else:
                      af_str = "highpass=f=160,volume=0.85"
                  cmd = [
                      'ffmpeg', '-y', '-ss', str(st), '-t', str(cd), '-i', c,
                      '-vf', vf_str, '-af', af_str, '-r', '30',
                      '-c:v', 'libx264', '-preset', 'fast', '-crf', '25', '-pix_fmt', 'yuv420p',
                      '-c:a', 'aac', '-ar', '44100', '-ac', '2', '-b:a', '112k', '-shortest', out_path
                  ]
              else:
                  cmd = [
                      'ffmpeg', '-y', '-ss', str(st), '-t', str(cd), '-i', c,
                      '-f', 'lavfi', '-t', str(cd), '-i', 'anullsrc=channel_layout=stereo:sample_rate=44100',
                      '-vf', vf_str, '-map', '0:v:0', '-map', '1:a:0', '-r', '30',
                      '-c:v', 'libx264', '-preset', 'fast', '-crf', '25', '-pix_fmt', 'yuv420p',
                      '-c:a', 'aac', '-ar', '44100', '-ac', '2', '-b:a', '112k', '-shortest', out_path
                  ]
              return subprocess.run(cmd, capture_output=True, text=True)

          for c, info, mode, segs in clip_plans:
              _, _, d, has_audio = info
              cname = os.path.basename(c)

              if mode == "full":
                  print(f"🎬 [{cname}] {d:.1f}s -> കട്ട് ചെയ്യാതെ പൂർണ്ണമായി എടുക്കുന്നു")
              elif mode == "face":
                  print(f"🧑 [{cname}] {d:.1f}s -> മുഖം കാണുന്ന {len(segs)} ഭാഗങ്ങൾ സംരക്ഷിക്കുന്നു")
              elif mode == "speech":
                  print(f"🎙️ [{cname}] {d:.1f}s -> പിന്നണിയിൽ സംസാരിക്കുന്ന {len(segs)} ഭാഗങ്ങൾ സംരക്ഷിക്കുന്നു")
              else:
                  segs = []
                  t = 0.0
                  while t + 1.2 <= d:
                      segs.append((t, min(SEG_LEN, d - t)))
                      t += step_interval
                  if not segs:
                      segs = [(0.0, min(SEG_LEN, d))]
                  print(f"🏞️ [{cname}] {d:.1f}s -> 2.5s വീതമുള്ള {len(segs)} കട്ടുകൾ (ഒന്നിടവിട്ട്) എടുക്കുന്നു")

              for st, cd in segs:
                  trf, out = f"work/t_{idx_p}.trf", f"work/p_{idx_p:04d}.mp4"
                  sp = f"scale={W}:{H}:force_original_aspect_ratio=decrease,pad={W}:{H}:(ow-iw)/2:(oh-ih)/2,format=yuv420p"

                  det = subprocess.run([
                      'ffmpeg', '-y', '-ss', str(st), '-t', str(cd), '-i', c,
                      '-vf', f'{sp},vidstabdetect=shakiness=5:accuracy=8:result={trf}',
                      '-f', 'null', '-'
                  ], capture_output=True, text=True)

                  if det.returncode == 0 and os.path.exists(trf):
                      vf_primary = f"{sp},vidstabtransform=input={trf}:smoothing=14:zoom=4,{color_filter}"
                  else:
                      vf_primary = f"{sp},{color_filter}"

                  res = run_encode(c, st, cd, vf_primary, has_audio, True, out)

                  if res.returncode != 0 or not os.path.exists(out) or os.path.getsize(out) < 1024:
                      vf_safe = f"{sp},eq=contrast=1.05:saturation=1.10"
                      res = run_encode(c, st, cd, vf_safe, has_audio, False, out)

                  if res.returncode == 0 and os.path.exists(out) and os.path.getsize(out) > 1024:
                      parts.append(out)
                      idx_p += 1
                  else:
                      if os.path.exists(out):
                          os.remove(out)
                      print(f"⚠️ Segment {idx_p} skipped.")

          if not parts:
              raise RuntimeError("No valid video segments were rendered!")

          print(f"✅ ആകെ {len(parts)} കട്ടുകൾ കൂട്ടിച്ചേർക്കുന്നു...")
          with open("work/list.txt", "w") as f:
              for p in parts:
                  f.write(f"file '{os.path.abspath(p)}'\n")

          merge_res = subprocess.run([
              'ffmpeg', '-y', '-f', 'concat', '-safe', '0', '-i', 'work/list.txt',
              '-c', 'copy', 'work/merged.mp4'
          ], capture_output=True, text=True)
          if merge_res.returncode != 0:
              raise RuntimeError(f"Merge failed: {merge_res.stderr}")

          if bgm_files:
              selected_bgm = bgm_files[0]
              print(f"🎵 BGM കണ്ടെത്തി: {os.path.basename(selected_bgm)} (Smart Audio Ducking ചേർക്കുന്നു...)")
              duck_filter = (
                  "[1:a]aformat=sample_rates=44100:channel_layouts=stereo,volume=0.25[bg];"
                  "[0:a]asplit=2[orig][sc];"
                  "[bg][sc]sidechaincompress=threshold=0.035:ratio=6:attack=150:release=800[bg_ducked];"
                  "[orig][bg_ducked]amix=inputs=2:duration=first:dropout_transition=2[aout]"
              )
              bgm_res = subprocess.run([
                  'ffmpeg', '-y', '-i', 'work/merged.mp4', '-stream_loop', '-1', '-i', selected_bgm,
                  '-filter_complex', duck_filter,
                  '-map', '0:v', '-map', '[aout]', '-c:v', 'copy', '-c:a', 'aac', '-b:a', '128k', '-shortest', FINAL_FILE
              ], capture_output=True, text=True)
              if bgm_res.returncode != 0:
                  print("⚠️ BGM mix failed, saving without BGM:", bgm_res.stderr[-200:])
                  shutil.move('work/merged.mp4', FINAL_FILE)
          else:
              shutil.move('work/merged.mp4', FINAL_FILE)

          cid = os.environ.get("GDRIVE_CLIENT_ID")
          csec = os.environ.get("GDRIVE_CLIENT_SECRET")
          rtok = os.environ.get("GDRIVE_REFRESH_TOKEN")
          m = re.search(r'folders/([a-zA-Z0-9_-]+)', DRIVE_LINK)

          if not (cid and csec and rtok and m):
              raise RuntimeError("Google Drive Secrets അല്ലെങ്കിൽ Folder Link കൃത്യമല്ല!")

          print(f"☁️ '{FINAL_FILE}' Google Drive-ലേക്ക് അപ്‌ലോഡ് ചെയ്യുന്നു...")
          folder_id = m.group(1)
          tok_res = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id": cid, "client_secret": csec,
              "refresh_token": rtok, "grant_type": "refresh_token"
          }).json()
          access_token = tok_res.get("access_token")
          if not access_token:
              raise RuntimeError(f"Token error: {tok_res}")

          headers = {"Authorization": f"Bearer {access_token}", "Content-Type": "application/json; charset=UTF-8"}
          meta = {"name": FINAL_FILE, "parents": [folder_id]}
          init = requests.post("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable", headers=headers, data=json.dumps(meta))
          upload_url = init.headers.get("Location")
          if not upload_url:
              raise RuntimeError(f"Drive upload init failed: {init.text}")

          with open(FINAL_FILE, "rb") as vf_data:
              up = requests.put(upload_url, data=vf_data)
          if up.status_code in (200, 201):
              print(f"🎉 '{FINAL_FILE}' വിജയകരമായി Google Drive ഫോൾഡറിൽ സേവ് ആയി!")
          else:
              raise RuntimeError(f"Drive upload failed: {up.status_code} {up.text}")
          EOF
          python edit.py
