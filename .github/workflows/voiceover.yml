name: Generate Malayalam Voiceover Script

on:
  workflow_dispatch:
    inputs:
      video_input:
        description: 'Google Drive video link, file ID, or filename (leave blank for latest Edited_Vlog_*.mp4)'
        required: false
        default: ''
        type: string
      style:
        description: 'Voiceover tone and style'
        required: false
        default: 'Engaging, warm, conversational Malayalam travel vlog storytelling'
        type: string
      extra_notes:
        description: 'Optional context (e.g., place names, companions, special moments)'
        required: false
        default: ''
        type: string

jobs:
  generate-voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth google-auth-oauthlib

      - name: Generate Malayalam Voiceover Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
          VIDEO_INPUT: ${{ github.event.inputs.video_input }}
          VOICEOVER_STYLE: ${{ github.event.inputs.style }}
          EXTRA_NOTES: ${{ github.event.inputs.extra_notes }}
        run: python scripts/generate_voiceover.py

      - name: Upload Voiceover Scripts as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malayalam-voiceover-script
          path: output_scripts/*
          if-no-files-found: warn
